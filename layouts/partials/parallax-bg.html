<style>
.parallax-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: -9999;
    pointer-events: none;
}
.parallax-image-wrap {
    position: absolute;
    width: 140vw;
    height: 100vh;
    left: -20vw;
    top: 0;
    overflow: hidden;
    pointer-events: none;
    will-change: transform;
    transition: transform 0.1s linear;
}
.parallax-layer {
    width: 140vw;
    height: 100vh;
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    pointer-events: none;
    will-change: transform;
}
/* start hidden and fade in when the image is ready */
.parallax-layer {
    opacity: 0;
    transition: opacity 1500ms ease-in-out; /* slower fade */
}
.parallax-layer.loaded {
    opacity: 1;
}
</style>
<div class="parallax-container">
    <div class="parallax-image-wrap" id="wrap5" style="z-index: 1;">
        <div class="parallax-layer" id="layer5" style="background-image: url('/background/5.png');"></div>
    </div>
    <div class="parallax-image-wrap" id="wrap4" style="z-index: 2;">
        <div class="parallax-layer" id="layer4" style="background-image: url('/background/4.png');"></div>
    </div>
    <div class="parallax-image-wrap" id="wrap3" style="z-index: 3;">
        <div class="parallax-layer" id="layer3" style="background-image: url('/background/3.png');"></div>
    </div>
    <div class="parallax-image-wrap" id="wrap2" style="z-index: 4;">
        <div class="parallax-layer" id="layer2" style="background-image: url('/background/2.png');"></div>
    </div>
    <div class="parallax-image-wrap" id="wrap1" style="z-index: 5;">
        <div class="parallax-layer" id="layer1" style="background-image: url('/background/1.png');"></div>
    </div>
    <div class="parallax-image-wrap" id="wrap0" style="z-index: 6;">
        <div class="parallax-layer" id="layer0" style="background-image: url('/background/0.png');"></div>
    </div>
</div>
<script>
    // Mouse-move parallax horizontal effect
    const wraps = [
        { el: document.getElementById('wrap5'), depth: 0 }, // furthest back, slowest
        { el: document.getElementById('wrap4'), depth: .1 },
        { el: document.getElementById('wrap3'), depth: 0.25 },
        { el: document.getElementById('wrap2'), depth: 0.75 },
        { el: document.getElementById('wrap1'), depth: 1.5 },
        { el: document.getElementById('wrap0'), depth: 2 }  // front, fastest
    ];
    let mouseX = 0, targetX = 0;
    let tiltX = 0;
    let lastGamma = 0;
    let useTilt = false;
    let aspectScale = 1;
    function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }
    function updateAspectScale() {
        const aspect = window.innerWidth / window.innerHeight;
        const minScale = 0.35;
        const maxScale = 1;
        const minAspect = 0.75;
        const maxAspect = 1.6;
        const normalized = clamp((aspect - minAspect) / (maxAspect - minAspect), 0, 1);
        aspectScale = minScale + (maxScale - minScale) * normalized;
        if (useTilt) {
            updateTiltX(lastGamma);
        }
    }
    function lerp(a, b, n) { return a + (b - a) * n; }
    function animate() {
        const inputX = useTilt ? tiltX : mouseX;
        targetX = lerp(targetX, inputX, 0.1);
        wraps.forEach(wrap => {
            const moveX = targetX * wrap.depth;
            wrap.el.style.transform = `translateX(${moveX}px)`;
        });
        requestAnimationFrame(animate);
    }
    window.addEventListener('mousemove', e => {
        const w = window.innerWidth;
        mouseX = (e.clientX - w/2) / (w/2) * 80 * aspectScale;
    });
    function updateTiltX(gamma) {
        const normalized = clamp(gamma / 30, -1, 1);
        tiltX = normalized * 80 * aspectScale;
    }
    function handleDeviceOrientation(event) {
        if (typeof event.gamma !== 'number') return;
        useTilt = true;
        lastGamma = event.gamma;
        updateTiltX(lastGamma);
    }
    function requestTiltPermission() {
        if (typeof DeviceOrientationEvent === 'undefined') return;
        if (typeof DeviceOrientationEvent.requestPermission !== 'function') {
            window.addEventListener('deviceorientation', handleDeviceOrientation);
            return;
        }
        const onFirstInteraction = () => {
            DeviceOrientationEvent.requestPermission()
                .then(state => {
                    if (state === 'granted') {
                        window.addEventListener('deviceorientation', handleDeviceOrientation);
                    }
                })
                .catch(() => {});
            window.removeEventListener('click', onFirstInteraction);
            window.removeEventListener('touchstart', onFirstInteraction);
        };
        window.addEventListener('click', onFirstInteraction, { once: true });
        window.addEventListener('touchstart', onFirstInteraction, { once: true });
    }
    window.addEventListener('resize', updateAspectScale);
    if (window.matchMedia('(pointer: coarse)').matches) {
        requestTiltPermission();
    }
    updateAspectScale();
    animate();

    // Fade-in background images after the user moves the mouse and the images are loaded.
    (function preloadAndWaitForMouse() {
        const layers = Array.from(document.querySelectorAll('.parallax-layer'));
        const state = layers.map(layer => ({ el: layer, loaded: false }));

        // Preload backgrounds
        state.forEach(s => {
            const bg = s.el.style.backgroundImage;
            if (!bg) {
                s.loaded = true;
                return;
            }
            const match = bg.match(/url\(["']?(.*?)["']?\)/);
            if (!match) {
                s.loaded = true;
                return;
            }
            const url = match[1];
            const img = new Image();
            img.onload = () => { s.loaded = true; }; 
            img.onerror = () => { s.loaded = true; };
            img.src = url;
        });

        // Reveal only after first meaningful mousemove
        let userMoved = false;
        function tryReveal() {
            if (!userMoved) return;
            // only reveal layers that are marked loaded
            state.forEach(s => {
                if (s.loaded) s.el.classList.add('loaded');
            });
        }

        function onFirstMove(e) {
            // ignore tiny involuntary moves — only treat as interaction when movement > 2px
            if (!window._parallaxLastMouse) window._parallaxLastMouse = { x: e.clientX, y: e.clientY };
            const last = window._parallaxLastMouse;
            const dx = Math.abs(e.clientX - last.x);
            const dy = Math.abs(e.clientY - last.y);
            if (dx + dy < 3) return; // too small
            userMoved = true;
            window.removeEventListener('mousemove', onFirstMove);
            tryReveal();
        }

        // Watch for loads happening after the mouse move
        const observerInterval = setInterval(() => {
            if (userMoved) {
                state.forEach(s => { if (s.loaded) s.el.classList.add('loaded'); });
                // If all loaded, stop polling
                if (state.every(s => s.loaded)) clearInterval(observerInterval);
            }
        }, 200);

        window.addEventListener('mousemove', onFirstMove);
    })();
</script>
